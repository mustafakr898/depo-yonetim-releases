<!DOCTYPE html>
<html lang="tr">
<head>
  <!--
    Base href: `flutter build web --base-href /depo-yonetim-releases/` ile
    doldurulur (GitHub Pages alt yolu).
  -->
  <base href="/depo-yonetim-releases/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Flash Depo — stok, fiş ve sipariş takibi.">

  <!-- iPhone: ana ekrana eklenince tam ekran uygulama gibi açılır -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Depo">
  <meta name="theme-color" content="#3949AB">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Depo Yönetimi</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Çevrimdışı açılış: yayın sırasında üretilen depo_sw.js uygulama
    // dosyalarını önbelleğe alır (depoda internet kesilse de uygulama açılır;
    // veriler zaten tarayıcı veritabanında). Dosya yoksa (yerel geliştirme)
    // kayıt sessizce başarısız olur.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('depo_sw.js').catch(function () {});
      });
    }
    // TEK SEKME KİLİDİ: tarayıcı SQLite'ı çalışansız modda her sekmede AYRI
    // kopya açar; iki sekme aynı veritabanına yazarsa birbirini ezer (kuyruk
    // kaybı). İlk sekme kilidi sayfa açık kaldıkça tutar; ikinci sekme
    // uygulamayı AÇMAZ. Web Locks yoksa (çok eski tarayıcı) engel yok.
    window.depoTekSekme = new Promise(function (coz) {
      try {
        if (!navigator.locks || !navigator.locks.request) { coz(true); return; }
        navigator.locks.request('depo-tek-sekme', { ifAvailable: true }, function (kilit) {
          coz(!!kilit);
          if (kilit) return new Promise(function () {});
        }).catch(function () { coz(true); });
      } catch (e) { coz(true); }
    });
    // KALICI DEPOLAMA: tarayıcıdan yerel veritabanını (gönderilmemiş kayıtlar
    // dahil) kendiliğinden SİLMEMESİNİ iste. Ana ekrana eklenmiş uygulamada
    // Safari genelde kabul eder; reddedilirse davranış eskisi gibidir.
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(function () {});
    }
    // 29.09 (saha: HASAN'ın iPhone'u 0.9.74'te takılı kaldı — yeni sürümün
    // önbellek çalışanı zayıf ağda kurulamıyor, telefon ESKİ önbellekten
    // açılmaya devam ediyordu). Bu sayfa her açılışta ağdan gelir (çalışan
    // sayfa isteğini önce ağa sorar) → yayın sürümünü taşır; çalışan
    // (önbellekteki) uygulama sürümü version.json'dan okunur.
    var DEPO_SAYFA_SURUM = '0.9.80';
    var depoOnarimAnahtar = 'depo-onarim-son';
    // İnternet VARSA eski önbelleği bırakıp yeni sürümü doğrudan ağdan açar
    // (çevrimdışıyken ASLA — önbelleksiz uygulama açılamaz). En çok 10 dk'da
    // bir (döngü koruması).
    // sessiz=true (kendini onarma): süre dolmadıysa HİÇBİR ŞEY yapmaz — düz
    // yenileme aynı eski sürümü açıp döngüye girerdi (yayından hemen sonra
    // Pages önbelleği yeni sayfayı/eski çalışanı birkaç dk birlikte verebilir).
    window.depoZorlaYenile = function (sessiz) {
      var yenile = function () { window.location.reload(); };
      try {
        var son = +(localStorage.getItem(depoOnarimAnahtar) || 0);
        if (Date.now() - son < 600000) { if (!sessiz) yenile(); return; }
        localStorage.setItem(depoOnarimAnahtar, String(Date.now()));
      } catch (e) {}
      fetch('https://raw.githubusercontent.com/mustafakr898/depo-yonetim-releases/main/version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (y) {
          if (!y.ok) { yenile(); return; }
          // Yalnız çalışan kaldırılır: sayfa artık ağdan açılır. Önbellek
          // SİLİNMEZ — yeniden kurulan çalışan değişmeyen dosyaları oradan
          // kopyalar (parmak izi); eski önbellekleri kendi temizler.
          return navigator.serviceWorker.getRegistrations()
            .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
            .then(yenile, yenile);
        })
        .catch(yenile);
    };
    // Güncelleme: yeni sürümün önbellek çalışanı KURULUP DEVREYE GİRENE kadar
    // bekler (en çok 45 sn), sonra yeniler. 29.09: devreye GİREMEDİYSE
    // (kurulum yarıda kaldı) düz yenileme yine ESKİ sürümü açıyordu → internet
    // varsa eski önbellek bırakılıp yeni sürüm ağdan açılır. Uygulama (Dart)
    // bunu çağırır.
    window.depoGuncelleVeYenile = function () {
      var yenile = function () { window.location.reload(); };
      if (!('serviceWorker' in navigator)) { yenile(); return; }
      navigator.serviceWorker.getRegistration().then(function (r) {
        if (!r) { yenile(); return; }
        var bitti = false;
        var basarili = function () { if (!bitti) { bitti = true; yenile(); } };
        var basarisiz = function () {
          if (!bitti) { bitti = true; window.depoZorlaYenile(); }
        };
        setTimeout(basarisiz, 45000);
        navigator.serviceWorker.addEventListener('controllerchange', basarili);
        r.update().then(function () {
          // Yeni çalışan yoksa: ya zaten günceliz (düz yenileme) ya da kurulum
          // sessizce düştü (sürüm karşılaştırması aşağıdaki kendini onarmada).
          if (!r.installing && !r.waiting) basarili();
        }).catch(basarisiz);
      }).catch(yenile);
    };
    // KENDİNİ ONARMA: çalışan uygulama bu sayfanın sürümünden ESKİYSE önce
    // normal güncelleme denenir (yeni çalışan devreye girince yenilenir);
    // yeni çalışan yoksa / 45 sn'de devreye girmezse zorla yenileme (10 dk'da
    // en çok bir, yalnız internet varken). Düz yenileme YOK (döngü olurdu).
    // Önbellek çalışanı yoksa (ilk kurulum / yerel geliştirme) hiçbir şey yapmaz.
    var depoOnar = function () {
      navigator.serviceWorker.getRegistration().then(function (r) {
        if (!r) return;
        var bitti = false;
        // 29.09 (saha: KAĞAN): OTURUM AÇIKKEN kendiliğinden yenileme YOK —
        // kullanıcı girişe düşüyordu. Yeni çalışan devrede; yeni sürüm bir
        // sonraki açılışta gelir (uygulamanın 'Güncelle' düğmesi aynen çalışır).
        var tamam = function () {
          if (bitti) return;
          bitti = true;
          if (window.depoOturumAcik === true) return;
          window.location.reload();
        };
        // Tarayıcı yeni çalışanı bu adımdan ÖNCE kendisi kurup devreye almış
        // olabilir (devreye girme bildirimi kaçmış) → önce yeniden bak: yeni
        // sürüm artık sunuluyorsa düz yenileme yeter; değilse zorla.
        // Denetim (29.09): zorla yenileme önbellek çalışanını kaldırır — zayıf
        // ağda telefon bir süre ÇEVRİMDIŞI açılamaz. Bu yüzden YALNIZ gerçekten
        // takılı telefonda: aynı hedef sürüme geçemeyiş en az 30 dk sürüyorsa
        // (yayın sonrası CDN gecikmesi / tek seferlik yavaşlık zorlamaz).
        var zorla = function () {
          if (bitti) return;
          bitti = true;
          if (window.depoOturumAcik === true) return; // oturum açıkken yok
          fetch('version.json').then(function (y) { return y.json(); }).then(function (v) {
            if (window.depoOturumAcik === true) return;
            if (v && v.version === DEPO_SAYFA_SURUM) { window.location.reload(); return; }
            if (depoUzunSuredirEski()) window.depoZorlaYenile(true);
          }).catch(function () {});
        };
        navigator.serviceWorker.addEventListener('controllerchange', tamam);
        setTimeout(zorla, 45000);
        r.update().then(function () {
          if (!r.installing && !r.waiting) zorla();
        }).catch(zorla);
      }).catch(function () {});
    };
    // Eski sürümde ilk görülme zamanı (hedef sürüm başına). Tarayıcı hafızası
    // yoksa (özel mod) 'uzun süredir' SAYILMAZ → zorlanmaz (güvenli taraf).
    var depoEskiAnahtar = 'depo-eski-surum-ilk';
    var depoEskiIsaretle = function (eski) {
      try {
        if (!eski) { localStorage.removeItem(depoEskiAnahtar); return; }
        var k = JSON.parse(localStorage.getItem(depoEskiAnahtar) || 'null');
        if (!k || k.hedef !== DEPO_SAYFA_SURUM) {
          localStorage.setItem(depoEskiAnahtar,
              JSON.stringify({ hedef: DEPO_SAYFA_SURUM, t: Date.now() }));
        }
      } catch (e) {}
    };
    var depoUzunSuredirEski = function () {
      try {
        var k = JSON.parse(localStorage.getItem(depoEskiAnahtar) || 'null');
        return !!k && k.hedef === DEPO_SAYFA_SURUM && Date.now() - k.t >= 1800000;
      } catch (e) { return false; }
    };
    window.addEventListener('load', function () {
      if (DEPO_SAYFA_SURUM.indexOf('__') === 0) return; // yerel geliştirme
      if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) return;
      setTimeout(function () {
        fetch('version.json').then(function (y) { return y.json(); }).then(function (v) {
          var calisan = v && v.version;
          if (!calisan) return;
          var eski = calisan !== DEPO_SAYFA_SURUM;
          depoEskiIsaretle(eski);
          if (!eski) return;
          depoOnar();
        }).catch(function () {});
      }, 5000);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
